<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A/B Testing Tracker</title>
    <script src="popup.js" defer></script>
    <link rel="stylesheet" href="/ab-testing-tracker-extension/index.html">
</head>

<body>

    <!-- nav for logo, clear CTA and refresh CTA-->
    <div class="hd">
        <div class="logo">
            <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
                <circle cx="11" cy="11" r="9.5" stroke="#00e5ff" stroke-width="1.4" />
                <path d="M7 11h8M11 7v8" stroke="#00e5ff" stroke-width="1.4" stroke-linecap="round" />
                <circle cx="11" cy="11" r="2.5" fill="#00e5ff" opacity=".3" />
            </svg>
            <span class="logo-text">A/B <em>TRACKER</em></span>
        </div>


        <div class="hd-actions">
            <button class="btn-sm" id="btnClear">CLEAR GOALS</button>
            <button class="btn-sm" id="btnRefresh" title="Refresh">
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                    <path d="M1 7a6 6 0 1 0 1.2-3.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
                    <path d="M1 3v1.5H2.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
            </button>
        </div>
    </div>

<!-- tabs showing which tool is active on present tab wesbite -->

<div class="pbar">
 <div class="pb off" id="pb-c"><div class="dot"></div>Convert</div>
  <div class="pb off" id="pb-o"><div class="dot"></div>Optimizely</div>
  <div class="pb off" id="pb-v"><div class="dot"></div>VWO</div>
</div>

<div class="tabs">
    <div class="tab active" data-t="experiments">Experiments <span class="bdg" id="ec">0</span></div>
    <div class="tab" data-t="goals">Goals Fired <span class="bdg" id="gc">0</span></div>
    </div>
 <!-- first load screen content -->
<div class="content">
  <div class="panel active" id="p-experiments">
    <div class="loading" id="loadingEl">
      <div class="spinner"></div>
      <span style="font-family:var(--mono);font-size:12px;color:var(--muted)">Scanning…</span>
    </div>
    <div id="expList"></div>
  </div>

 
   <div class="panel" id="p-goals">
    <div class="goals-hint">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="#22c55e"><circle cx="6" cy="6" r="6"/><path d="M3.5 6l2 2 3-3" stroke="white" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Goals captured in real-time as they fire on the page.
    </div>
    <div id="goalList"></div>
    <div id="goalEmpty" class="empty" style="display:none">
      <div class="e-icon"><svg width="36" height="36" viewBox="0 0 36 36" fill="none"><circle cx="18" cy="18" r="16" stroke="#64748b" stroke-width="1.3"/><path d="M11 18h14M18 11v14" stroke="#64748b" stroke-width="1.3" stroke-linecap="round"/></svg></div>
      <div class="e-title">No goals fired yet</div>
      <div class="e-sub">Interact with the page and conversions will appear here.</div>
    </div>
  </div>
</div>

<!-- For time and Url to show of present tab and present date -->
<div class="ft">
  <div class="ft-url" id="ftUrl">—</div>
  <div class="ft-ts"  id="ftTs">—</div>
</div>


</body>

</html>
